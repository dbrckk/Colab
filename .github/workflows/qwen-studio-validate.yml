name: Validate Qwen Studio

on:
  push:
    paths:
      - "qwen_studio_v8/**"
      - "Qwen_Image_2_1_Heretic_GGUF_Gradio_v8_PremiumUX.ipynb"
      - "kaggle_app/**"
      - "kaggle_worker/**"
      - "launch_kaggle_ui.py"
      - "Qwen_Kaggle_Studio_Controller.ipynb"
      - "requirements-kaggle-ui.txt"
      - "scripts/validate_qwen_studio.py"
      - "scripts/test_video_checkpoint.py"
      - "scripts/test_gradio_ui_smoke.py"
      - "scripts/test_kaggle_controller.py"
      - "scripts/test_kaggle_auth.py"
      - "scripts/test_kaggle_dataset.py"
      - "scripts/test_kaggle_inputs.py"
      - "scripts/test_kaggle_kernel.py"
      - "scripts/test_kaggle_outputs.py"
      - "scripts/test_kaggle_protocol.py"
      - "scripts/test_kaggle_recovery.py"
      - "scripts/test_kaggle_ui_smoke.py"
      - "scripts/test_kaggle_cli_contract.py"
      - ".github/workflows/qwen-studio-validate.yml"
  pull_request:
    paths:
      - "qwen_studio_v8/**"
      - "Qwen_Image_2_1_Heretic_GGUF_Gradio_v8_PremiumUX.ipynb"
      - "kaggle_app/**"
      - "kaggle_worker/**"
      - "launch_kaggle_ui.py"
      - "Qwen_Kaggle_Studio_Controller.ipynb"
      - "requirements-kaggle-ui.txt"
      - "scripts/validate_qwen_studio.py"
      - "scripts/test_video_checkpoint.py"
      - "scripts/test_gradio_ui_smoke.py"
      - "scripts/test_kaggle_controller.py"
      - "scripts/test_kaggle_auth.py"
      - "scripts/test_kaggle_dataset.py"
      - "scripts/test_kaggle_inputs.py"
      - "scripts/test_kaggle_kernel.py"
      - "scripts/test_kaggle_outputs.py"
      - "scripts/test_kaggle_protocol.py"
      - "scripts/test_kaggle_recovery.py"
      - "scripts/test_kaggle_ui_smoke.py"
      - "scripts/test_kaggle_cli_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-studio-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI and Kaggle CLI test dependencies
        run: python -m pip install --disable-pip-version-check --quiet "gradio>=6.0" "kaggle>=2.2.3"
      - name: Validate notebook modules
        run: python scripts/validate_qwen_studio.py
      - name: Runtime checkpoint test
        run: python scripts/test_video_checkpoint.py
      - name: Gradio UI smoke test
        run: python scripts/test_gradio_ui_smoke.py
      - name: Kaggle controller unit test
        run: python scripts/test_kaggle_controller.py
      - name: Kaggle auth policy unit test
        run: python scripts/test_kaggle_auth.py
      - name: Kaggle dataset staging unit test
        run: python scripts/test_kaggle_dataset.py
      - name: Kaggle submission validation unit test
        run: python scripts/test_kaggle_inputs.py
      - name: Kaggle kernel bundle unit test
        run: python scripts/test_kaggle_kernel.py
      - name: Kaggle output validation unit test
        run: python scripts/test_kaggle_outputs.py
      - name: Kaggle protocol unit test
        run: python scripts/test_kaggle_protocol.py
      - name: Kaggle recovery policy unit test
        run: python scripts/test_kaggle_recovery.py
      - name: Kaggle Studio UI smoke test
        run: python scripts/test_kaggle_ui_smoke.py
      - name: Launcher import smoke test
        run: python -c "import launch_kaggle_ui; print('Kaggle UI launcher import passed.')"
      - name: Kaggle CLI contract test
        run: python scripts/test_kaggle_cli_contract.py
