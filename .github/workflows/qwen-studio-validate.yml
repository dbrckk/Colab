name: Validate Qwen Studio

on:
  push:
    paths:
      - "qwen_studio_v8/**"
      - "Qwen_Image_2_1_Heretic_GGUF_Gradio_v8_PremiumUX.ipynb"
      - "scripts/validate_qwen_studio.py"
      - "scripts/test_video_checkpoint.py"
      - "scripts/test_gradio_ui_smoke.py"
      - ".github/workflows/qwen-studio-validate.yml"
  pull_request:
    paths:
      - "qwen_studio_v8/**"
      - "Qwen_Image_2_1_Heretic_GGUF_Gradio_v8_PremiumUX.ipynb"
      - "scripts/validate_qwen_studio.py"
      - "scripts/test_video_checkpoint.py"
      - "scripts/test_gradio_ui_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gradio for UI smoke test
        run: python -m pip install --disable-pip-version-check --quiet gradio
      - name: Validate notebook modules
        run: python scripts/validate_qwen_studio.py
      - name: Runtime checkpoint test
        run: python scripts/test_video_checkpoint.py
      - name: Gradio UI smoke test
        run: python scripts/test_gradio_ui_smoke.py
